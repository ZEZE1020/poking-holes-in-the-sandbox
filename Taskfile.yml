# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  GCP_TOFU_DIR: provisioning/tofu-gcp
  AZURE_TOFU_DIR: provisioning/tofu-azure

env:
  WORKSHOP_SOURCE_CIDR:
    sh: |
      if [ -n "${WORKSHOP_SOURCE_CIDR:-}" ]; then
        printf '%s\n' "$WORKSHOP_SOURCE_CIDR"
      else
        ./scripts/public-ip-cidr.sh
      fi

tasks:
  infra:init:
    desc: Initialize the GCP OpenTofu working directory
    cmds:
      - tofu -chdir={{.GCP_TOFU_DIR}} init

  infra:plan:
    desc: Preview the GCP infrastructure changes using the current public IP
    cmds:
      - |
        export TF_VAR_source_ranges="[\"${WORKSHOP_SOURCE_CIDR}\"]"
        tofu -chdir={{.GCP_TOFU_DIR}} plan
    preconditions:
      - sh: test -n "$WORKSHOP_SOURCE_CIDR"
        msg: "A public IPv4 CIDR could not be determined. Set WORKSHOP_SOURCE_CIDR manually."

  infra:up:
    desc: Provision GCP attendee nodes using the current public IP
    cmds:
      - |
        export TF_VAR_source_ranges="[\"${WORKSHOP_SOURCE_CIDR}\"]"
        tofu -chdir={{.GCP_TOFU_DIR}} apply -auto-approve
        tofu -chdir={{.GCP_TOFU_DIR}} output terminal_urls
    preconditions:
      - sh: test -n "$WORKSHOP_SOURCE_CIDR"
        msg: "A public IPv4 CIDR could not be determined. Set WORKSHOP_SOURCE_CIDR manually."

  infra:down:
    desc: Destroy the GCP workshop infrastructure
    cmds:
      - tofu -chdir={{.GCP_TOFU_DIR}} destroy -auto-approve

  workshop:sync:gcp:
    desc: Copy the current labs into an existing GCP browser terminal
    vars:
      GCP_NODE_NAME: '{{default "sandbox-01" .GCP_NODE_NAME}}'
      GCP_ZONE: '{{default "us-central1-a" .GCP_ZONE}}'
    cmds:
      - |
        set -eu
        archive="$(mktemp)"
        trap 'rm -f "$archive"' EXIT
        tar -czf "$archive" README.md lab1-runc lab2-kata lab3-metrics
        gcloud compute scp "$archive" "{{.GCP_NODE_NAME}}:/tmp/workshop-materials.tgz" \
          --project="${TF_VAR_project_id:?Set TF_VAR_project_id}" \
          --zone="{{.GCP_ZONE}}"
        gcloud compute ssh "{{.GCP_NODE_NAME}}" \
          --project="${TF_VAR_project_id}" \
          --zone="{{.GCP_ZONE}}" \
          --command='set -eu
            sudo install -d -m 0755 /home/workshop/workshop
            sudo tar -xzf /tmp/workshop-materials.tgz -C /home/workshop/workshop
            sudo chown -R workshop:workshop /home/workshop/workshop
            rm -f /tmp/workshop-materials.tgz'

  infra:azure:init:
    desc: Initialize the Azure OpenTofu working directory
    cmds:
      - tofu -chdir={{.AZURE_TOFU_DIR}} init

  infra:azure:plan:
    desc: Preview the Azure infrastructure changes using the current public IP
    cmds:
      - |
        export TF_VAR_allowed_source_cidrs="[\"${WORKSHOP_SOURCE_CIDR}\"]"
        tofu -chdir={{.AZURE_TOFU_DIR}} plan
    preconditions:
      - sh: test -n "$WORKSHOP_SOURCE_CIDR"
        msg: "A public IPv4 CIDR could not be determined. Set WORKSHOP_SOURCE_CIDR manually."

  infra:azure:up:
    desc: Provision the Azure workshop host using the current public IP
    cmds:
      - |
        export TF_VAR_allowed_source_cidrs="[\"${WORKSHOP_SOURCE_CIDR}\"]"
        tofu -chdir={{.AZURE_TOFU_DIR}} apply -auto-approve
        tofu -chdir={{.AZURE_TOFU_DIR}} output terminal_urls
    preconditions:
      - sh: test -n "$WORKSHOP_SOURCE_CIDR"
        msg: "A public IPv4 CIDR could not be determined. Set WORKSHOP_SOURCE_CIDR manually."

  infra:azure:down:
    desc: Destroy the Azure workshop infrastructure
    cmds:
      - tofu -chdir={{.AZURE_TOFU_DIR}} destroy -auto-approve

  local:setup:
    desc: Set up a local k3d cluster with Kata Containers
    deps:
      - install:k3d
    cmds:
      - ./scripts/setup-local-kata.sh

  local:clean:
    desc: Clean up the local k3d cluster and temporary files
    cmds:
      - k3d cluster delete local-workshop
      - rm -f /tmp/k3s-config.toml.tmpl

  install:k3d:
    desc: Install k3d if it is not already installed
    cmds:
      - |
        if ! command -v k3d &> /dev/null; then
          echo "k3d not found, installing..."
          curl https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        else
          echo "k3d is already installed."
        fi
    sources:
      - "null" # This ensures the task always runs its check
    generates:
      - "null" # This ensures the task always runs its check

  validate:
    desc: Validate all lab manifests with kubectl or offline checks
    cmds:
      - |
        set -eu
        if timeout 5 kubectl cluster-info >/dev/null 2>&1; then
          for manifest in lab1-runc/*.yaml lab2-kata/*.yaml lab3-metrics/*.yaml; do
            kubectl apply --dry-run=client --validate=false -f "$manifest" >/dev/null
            echo "validated $manifest"
          done
        else
          echo "No Kubernetes API server is available; running dependency-free manifest checks."
          for manifest in lab1-runc/*.yaml lab2-kata/*.yaml lab3-metrics/*.yaml; do
            test -s "$manifest"
            grep -Eq '^apiVersion:[[:space:]]*[^[:space:]]' "$manifest"
            grep -Eq '^kind:[[:space:]]*[^[:space:]]' "$manifest"
            grep -Eq '^metadata:' "$manifest"
            grep -Eq '^spec:' "$manifest"
            echo "validated $manifest"
          done
        fi

  security:check:
    desc: Check tracked and shareable files for common secrets
    cmds:
      - |
        set -eu
        files="$(git ls-files --cached --others --exclude-standard)"
        if [ -z "$files" ]; then
          echo "No shareable files found."
          exit 0
        fi
        if printf '%s\n' "$files" | grep -Eiq '(^|/)(\.env(\.|$)|.*(secret|credential|token|password|private).*\.(json|ya?ml|tfvars|txt|conf|cfg)$)'; then
          echo "Potential credential-bearing filename found in shareable files." >&2
          printf '%s\n' "$files" | grep -Ei '(^|/)(\.env(\.|$)|.*(secret|credential|token|password|private).*\.(json|ya?ml|tfvars|txt|conf|cfg)$)' >&2
          exit 1
        fi
        if git grep -nI -E 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|AIza[0-9A-Za-z_-]{20,}|-----BEGIN|password[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' -- $files ':!Taskfile.yml'; then
          echo "Potential secret material found. Remove it before committing or uploading." >&2
          exit 1
        fi
        echo "No common secret patterns found in shareable files."
