# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  TOFU_DIR: provisioning/tofu-gcp

tasks:
  infra:init:
    desc: Initialize the OpenTofu working directory
    cmds:
      - tofu -chdir={{.TOFU_DIR}} init

  infra:plan:
    desc: Preview the GCP infrastructure changes
    cmds:
      - tofu -chdir={{.TOFU_DIR}} plan

  infra:up:
    desc: Provision attendee nodes and print terminal URLs
    cmds:
      - tofu -chdir={{.TOFU_DIR}} apply -auto-approve
      - tofu -chdir={{.TOFU_DIR}} output terminal_urls

  infra:down:
    desc: Destroy the workshop infrastructure
    cmds:
      - tofu -chdir={{.TOFU_DIR}} destroy -auto-approve

  validate:
    desc: Validate all lab manifests with kubectl or offline checks
    cmds:
      - |
        set -eu
        if timeout 5 kubectl cluster-info >/dev/null 2>&1; then
          for manifest in lab1-runc/*.yaml lab2-kata/*.yaml lab3-metrics/*.yaml; do
            kubectl apply --dry-run=client --validate=false -f "$manifest" >/dev/null
            echo "validated $manifest"
          done
        else
          echo "No Kubernetes API server is available; running dependency-free manifest checks."
          for manifest in lab1-runc/*.yaml lab2-kata/*.yaml lab3-metrics/*.yaml; do
            test -s "$manifest"
            grep -Eq '^apiVersion:[[:space:]]*[^[:space:]]' "$manifest"
            grep -Eq '^kind:[[:space:]]*[^[:space:]]' "$manifest"
            grep -Eq '^metadata:' "$manifest"
            grep -Eq '^spec:' "$manifest"
            echo "validated $manifest"
          done
        fi

  security:check:
    desc: Check tracked and shareable files for common secrets
    cmds:
      - |
        set -eu
        files="$(git ls-files --cached --others --exclude-standard)"
        if [ -z "$files" ]; then
          echo "No shareable files found."
          exit 0
        fi
        if printf '%s\n' "$files" | grep -Eiq '(^|/)(\.env(\.|$)|.*(secret|credential|token|password|private).*\.(json|ya?ml|tfvars|txt|conf|cfg)$)'; then
          echo "Potential credential-bearing filename found in shareable files." >&2
          printf '%s\n' "$files" | grep -Ei '(^|/)(\.env(\.|$)|.*(secret|credential|token|password|private).*\.(json|ya?ml|tfvars|txt|conf|cfg)$)' >&2
          exit 1
        fi
        if git grep -nI -E 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|AIza[0-9A-Za-z_-]{20,}|-----BEGIN|password[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']' -- $files ':!Taskfile.yml'; then
          echo "Potential secret material found. Remove it before committing or uploading." >&2
          exit 1
        fi
        echo "No common secret patterns found in shareable files."
