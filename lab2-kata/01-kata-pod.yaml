apiVersion: v1
kind: Pod
metadata:
  name: kata-baseline
  labels:
    workshop: sandbox
    runtime: kata
spec:
  runtimeClassName: kata
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
