apiVersion: v1
kind: Pod
metadata:
  name: stress-kata
  labels:
    workshop: metrics
    runtime: kata
spec:
  runtimeClassName: kata
  containers:
    - name: stress
      image: polinux/stress-ng:latest
      command: ["stress-ng"]
      args: ["--cpu", "1", "--cpu-method", "matrixprod", "--timeout", "180s"]
      resources:
        requests:
          cpu: "1"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
